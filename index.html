<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f9fc"><meta name="description" content="Blur wajah secara lokal di browser Anda."><title>Autotrof Blur Face Offline</title>
  <link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon-192.png" type="image/png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="layout">
    <aside class="sidebar" aria-label="Daftar foto">
      <label class="upload-card" for="file-input">
        <span class="upload-symbol" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 16V4m0 0L7 9m5-5 5 5M5 14v5h14v-5"/></svg></span>
        <span><strong>Tambah foto</strong><small>Pilih atau jatuhkan beberapa foto</small></span>
      </label>
      <input id="file-input" type="file" accept="image/*" multiple hidden>
      <div id="image-list" class="image-list"></div>
      <div class="sidebar-bottom"><button id="download-all" class="button button-primary" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 5-5m-5 5-5-5M5 17v4h14v-4"/></svg><span>Unduh semua</span></button></div>
    </aside>
    <section class="workspace" aria-label="Editor foto">
      <div id="empty-state" class="empty-state">
        <div class="empty-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg></div>
        <h1>Blur Face</h1>
        <label for="file-input" class="button button-primary">Pilih foto</label>
      </div>
      <div id="drop-indicator" class="drop-indicator" aria-hidden="true"><div><span class="drop-symbol">＋</span><strong>Lepaskan foto di sini</strong><small>Anda bisa menambahkan beberapa foto sekaligus</small></div></div>
      <div id="batch-loading" class="batch-loading" role="status" aria-live="polite" hidden><span class="spinner"></span><span id="batch-loading-text">Memuat foto…</span></div>
      <div id="editor" class="editor" hidden>
        <div class="editor-head">
          <div class="file-title"><h1 id="active-name">—</h1><span id="active-size"></span></div>
          <button id="remove-image" class="icon-button" title="Hapus foto" aria-label="Hapus foto"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6m4-6v6M5 7l1 14h12l1-14M9 7V4h6v3"/></svg></button>
        </div>
        <div class="canvas-wrap" id="canvas-wrap"><canvas id="photo-canvas"></canvas><canvas id="overlay-canvas" aria-hidden="true"></canvas></div>
        <div class="canvas-foot"><span id="face-note"></span><span id="dimension-note"></span></div>
        <div class="controls">
          <div class="control-row controls-main">
            <div class="setting"><span class="control-label">Bentuk area</span><div class="segmented" role="group" aria-label="Bentuk area"><button type="button" class="shape-choice" data-shape="oval" aria-pressed="true"><span class="shape-icon oval-icon"></span>Oval</button><button type="button" class="shape-choice" data-shape="rect" aria-pressed="false"><span class="shape-icon rect-icon"></span>Persegi</button></div></div>
            <div class="setting strength-setting"><label class="control-label" for="strength">Intensitas <b id="strength-label">24</b></label><input id="strength" type="range" min="8" max="56" value="24"></div>
            <fieldset class="setting style-setting"><legend class="control-label">Gaya</legend><div class="segmented" role="radiogroup" aria-label="Gaya blur"><label class="style-choice"><input type="radio" name="blur-style" value="kotak" checked><span>Piksel</span></label><label class="style-choice"><input type="radio" name="blur-style" value="halus"><span>Halus</span></label></div></fieldset>
            <div class="setting add-setting"><span class="control-label">Area</span><button class="add-area" id="add-area" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Tambah area</button></div>
          </div>
        </div>
        <section class="crop-panel" aria-label="Bingkai foto"><div class="crop-heading"><strong>Bingkai foto</strong><span>Seret foto untuk mengatur posisi</span></div><div class="crop-tools"><div class="frame-modes" role="radiogroup" aria-label="Cara mengatur bingkai"><label><input type="radio" name="frame-mode" value="crop" checked><span>Potong</span></label><label><input type="radio" name="frame-mode" value="expand"><span>Perluas</span></label></div><label class="ratio-control">Rasio <select id="crop-ratio" aria-label="Rasio bingkai"><option value="original">Asli</option><option value="1:1">1:1</option><option value="4:3">4:3</option><option value="3:2">3:2</option><option value="16:9">16:9</option></select></label><label class="zoom-control">Zoom <input id="crop-zoom" type="range" min="1" max="3" step="0.01" value="1"></label><fieldset class="background-setting" id="background-setting"><legend>Latar</legend><label><input type="radio" name="expand-background" value="white" checked><span class="swatch white-swatch"></span>Putih</label><label><input type="radio" name="expand-background" value="black"><span class="swatch black-swatch"></span>Hitam</label></fieldset><button id="crop-position" class="text-button" type="button" aria-pressed="false">Atur posisi</button><button id="apply-crop-all" class="text-button" type="button">Terapkan ke semua foto</button></div></section>
        <div class="bottom-actions"><button id="download-one" class="button button-primary"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 5-5m-5 5-5-5M5 17v4h14v-4"/></svg>Unduh foto</button><span>PNG · ukuran asli</span></div>
      </div>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./app.js"></script>
  <script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js',{scope:'./'}).catch(console.error));}</script>
</body>
</html>
